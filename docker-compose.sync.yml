services:
  postgres:
    image: postgres:17-alpine
    container_name: scheme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scheme_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scheme_password}
      POSTGRES_DB: ${POSTGRES_DB:-scheme_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgrest:
    image: postgrest/postgrest:latest
    container_name: scheme-postgrest
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "3001:3000"
    environment:
      PGRST_DB_URI: "postgres://${POSTGRES_USER:-scheme_user}:${POSTGRES_PASSWORD:-scheme_password}@postgres:5432/${POSTGRES_DB:-scheme_db}"
      PGRST_DB_SCHEMAS: "public"
      PGRST_DB_ANON_ROLE: "${POSTGRES_USER:-scheme_user}"
      PGRST_SERVER_PORT: "3000"

volumes:
  postgres_data:
