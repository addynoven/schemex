services:
  postgres:
    image: postgres:17-alpine
    container_name: scheme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: scheme_db
      POSTGRES_USER: scheme_user
      POSTGRES_PASSWORD: scheme_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheme_user -d scheme_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: scheme-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_SERVER_URL: http://localhost:9000
      MINIO_REGION_NAME: us-east-1
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-createbuckets:
    image: minio/mc:latest
    container_name: scheme-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/scheme-documents --ignore-existing;
      /usr/bin/mc anonymous set download myminio/scheme-documents;
      exit 0;
      "

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: scheme-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules

volumes:
  postgres_data:
  minio_data:
